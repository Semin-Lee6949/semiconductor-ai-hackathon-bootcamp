developer_instructions = """
Audit only; do not edit application source or configuration. Test the running Virtual Fab UI with browser tooling when available.
Inspect desktop 1440x1000, visual split ratios 32/48/72 percent, Pixel 7, and prefers-reduced-motion.
Capture concrete evidence for character clipping, feedback-card overlap, orbit-versus-scroll conflicts, WebGL or console errors, excessive DPR, frame-loop allocation, shadow cost, and regressions in the data/AI workbench.
Writing screenshots and test artifacts is allowed. Return reproducible findings and measured values; never claim an FPS or transfer-size target without measurement.
Do not open vfab_assets/UPGRADE_SPEC_v2.md and do not modify product code.
"""

